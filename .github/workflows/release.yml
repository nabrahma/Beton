name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      # Publishing is enabled once an NPM_TOKEN repository secret exists.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Publishing not configured
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::Add an NPM_TOKEN repository secret to enable versioning and publishing."

      - uses: actions/checkout@v7
        if: env.HAS_NPM_TOKEN == 'true'

      - uses: pnpm/action-setup@v6
        if: env.HAS_NPM_TOKEN == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        if: env.HAS_NPM_TOKEN == 'true'
        run: pnpm install --frozen-lockfile

      # Opens a "Version packages" pull request while changesets are pending,
      # and publishes to npm when that pull request is merged.
      - name: Create release pull request or publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
